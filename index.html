<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Owocowe Kaskady</title><style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#050c15;overflow:hidden;color:#eef8ff;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.game{position:relative;width:min(543px,100vw,100dvh);height:min(543px,100vw,100dvh);container-type:inline-size;border-radius:18px;overflow:hidden;box-shadow:0 24px 80px #000a}canvas{width:100%;height:100%;display:block;touch-action:none}header{position:absolute;top:3.2cqw;left:4.4cqw;right:4.4cqw;display:flex;align-items:center;justify-content:space-between;gap:1.5cqw}small{font-size:1.65cqw;letter-spacing:.2em;color:#9bbace}h1{font-size:4.2cqw;margin:0;letter-spacing:-.04em}.headBtns{display:flex;gap:1cqw;align-items:center}button,select{border:1px solid #729daa44;border-radius:8px;color:#edf8ff;background:#284658;font:700 2cqw system-ui;padding:1.5cqw 2cqw;cursor:pointer;touch-action:none}button:hover{filter:brightness(1.2)}button:disabled{opacity:.45;cursor:default}.hud{position:absolute;top:13.3cqw;left:4.5cqw;right:4.5cqw;display:flex;justify-content:space-between;font-size:2cqw;color:#c2d9e0}#meter{color:#ffe1a1}#notice{position:absolute;top:18cqw;left:4cqw;right:4cqw;font-size:2.1cqw;text-align:center;color:#b4d0dd}.controls{position:absolute;bottom:4cqw;left:4.5cqw;right:4.5cqw;display:flex;gap:1.5cqw}.controls button{flex:1;font-size:2.1cqw;padding:1.4cqw 2cqw}#extra{background:#e9cf95;color:#1e3e47}#reset{border:0;background:transparent;color:#91aebe;font-size:1.7cqw;flex:.8}.help{position:absolute;bottom:.8cqw;left:0;right:0;text-align:center;color:#7f9eaf;font-size:1.7cqw}#panel{position:absolute;top:25cqw;bottom:17cqw;left:10cqw;right:10cqw;background:#0b1a2df5;border:1px solid #7393af77;border-radius:18px;backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5cqw;text-align:center}#panelTitle{font-size:5.3cqw;line-height:1.1;margin:0 0 3cqw}#panelText{font-size:2.8cqw;color:#b6d0dd;line-height:1.6;margin:0 0 4cqw}#start{width:100%;background:#ebd49e;color:#143340;font-size:2.8cqw;padding:2cqw}.icon{font-size:7cqw;color:#e9cf95;margin-bottom:2cqw}select{font-size:1.7cqw;padding:1.5cqw 1cqw;max-width:20cqw}</style><main class="game"><canvas id="c" width="543" height="543" tabindex="0" aria-label="Plansza gry 2D z góry"></canvas><header><div><small>POCKET PLAY / 02</small><h1>Owocowe Kaskady</h1></div><div class="headBtns"><select id="route" aria-label="Wybór trasy" style="display:none"></select><button id="pause">Pauza</button></div></header><div class="hud"><span id="score"></span><span id="meter"></span><span id="best"></span></div><div id="notice"></div><div class="controls"><button id="extra"></button><button id="restart">Od nowa</button><button id="reset">Reset postępu</button></div><div class="help">Kliknij dwa sąsiednie owoce • H: podpowiedź • P: pauza</div><div id="panel"><div class="icon">✦ ◇ ✦</div><h2 id="panelTitle"></h2><p id="panelText"></p><button id="start">Rozpocznij</button></div></main><script>const MODE=1,TITLE="Owocowe Kaskady",$=id=>document.getElementById(id),cv=$('c'),c=cv.getContext('2d');const A={x:24,y:116,w:495,h:350},palette=['#f47a87','#ffd776','#a5db8d','#b7a0e9','#79cce8'];let state='menu',paused=false,score=0,best=0,level=1,unlocked=1,clock=60,hp=3,inv=0,age=0,keys={},pointer=null,drag=null,selected=-1,hintCells=[],hintTime=0,seed=17,stars=[],comets=[],player={},grid=[],moves=20,ball={},hole={},walls=[],traps=[],coins=[],shots=8,moving=false,shotAge=0,toast='',toastTime=0,levelBaseScore=0,magnet=3,pulse=0;try{let s=JSON.parse(localStorage.getItem('casual-'+MODE)||'{}');best=s.best||0;unlocked=Math.max(1,Math.min(10,s.unlocked||1))}catch(e){}function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),d function record(){best=Math.max(best,score);save()}
function start(l=1){state='playing';paused=false;score=0;clock=60;hp=3;inv=0;age=0;keys={};pointer=null;drag=null;selected=-1;hintCells=[];toast='';toastTime=0;seed=191+MODE*257;level=l;levelBaseScore=0;magnet=3;pulse=0;
if(MODE===0){player={x:270,y:330,r:12};stars=[];for(let i=0;i<6;i++)spawnStar();comets=[{x:100,y:200,bx:125,by:200,t:0},{x:400,y:330,bx:380,by:340,t:2},{x:280,y:200,bx:280,by:205,t:4}]}
if(MODE===1){moves=20;makeGrid()}
if(MODE===2)setupLevel();sync();render()}
function spawnStar(){let s;for(let tries=0;tries<50;tries++){s={x:A.x+22+rand()*(A.w-44),y:A.y+22+rand()*(A.h-44),r:9};if(dist(s,player)>60&&stars.every(t=>dist(s,t)>30))break}stars.push(s)}
function matches(){let set=new Set();for(let r=0;r<6;r++)for(let col=0;col<6;col++){let i=r*6+col,v=grid[i];if(col<=3&&v===grid[i+1]&&v===grid[i+2]){set.add(i);set.add(i+1);set.add(i+2)}if(r<=3&&v===grid[i+6]&&v===grid[i+12]){set.add(i);set.add(i+6);set.add(i+12)}}return [...set]}

function makeGrid(){for(let tries=0;tries<500;tries++){grid=[];for(let r=0;r<6;r++)for(let col=0;col<6;col++){let i=r*6+col,opts=[0,1,2,3,4].filter(v=>!(col>1&&grid[i-1]===v&&grid[i-2]===v)&&!(r>1&&grid[i-6]===v&&grid[i-12]===v));grid.push(opts[Math.floor(rand()*opts.length)])}if(possible().length)return}}
function resolve(){let combo=0,m=matches();while(m.length){combo++;score+=m.length*10*combo;let found=new Set(m);for(let col=0;col<6;col++){let vals=[];for(let r=5;r>=0;r--)if(!found.has(r*6+col))vals.push(grid[r*6+col]);while(vals.length<6)vals.push(Math.floor(rand()*5));for(let r=5;r>=0;r--)grid[r*6+col]=vals[5-r]}m=matches();if(combo>100)break}return combo}
function fruitClick(i){if(state!=='playing'||paused)return;if(selected<0){selected=i;return}if(selected===i){selected=-1;return}if(!neighbor(selected,i)){selected=i;return}let j=selected;selected=-1;[grid[i],grid[j]]=[grid[j],grid[i]];if(!matches().length){[grid[i],grid[j]]=[grid[j],grid[i]];say('Zamiana musi utworzyć linię przynajmniej 3 owoców.');return}moves--;hintCells=[];let combo=resolve();if(score>=750){state='won';record()}else if(moves<=0){state='lost';record()}else if(!possible().length){makeGrid();say('Brak ruchów — nowa plansza bez utraty punktów.')}else say(combo>1?'Kaskada ×'+combo+'!':'Dobre połączenie!');sync()}
function setupLevel(){shots=8;moving=false;shotAge=0;drag=null;ball={x:68,y:416,vx:0,vy:0,r:10};hole={x:472,y:153,r:17};walls=[];traps=[];coins=[{x:137,y:170,taken:false},{x:407,y:380,taken:false}];if(level%3===1)walls=[{x:230,y:206,w:25,h:175}];if(level%3===2)walls=[{x:155,y:277,w:215,h:24}];if(level%3===0)walls=[{x:166,y:175,w:22,h:160},{x:350,y:271,w:22,h:135}];if(level>3)traps.push({x:130+level*9,y:220,r:15});if(level>6)traps.push({x:402,y:325,r:15})}
function launch(dx,dy){if(state!=='playing'||paused||moving||shots<=0)return;let d=Math.hypot(dx,dy);if(d<8)return;let power=Math.min(150,d),f=power*4/d;ball.vx=dx*f;ball.vy=dy*f;shots--;moving=true;shotAge=0;sync()}

function physics(dt){if(!moving)return;shotAge+=dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;let f=Math.exp(-1.25*dt);ball.vx*=f;ball.vy*=f;for(let [axis,min,max] of [['x',A.x+ball.r,A.x+A.w-ball.r],['y',A.y+ball.r,A.y+A.h-ball.r]]){if(ball[axis]<min||ball[axis]>max){ball[axis]=clamp(ball[axis],min,max);ball['v'+axis]*=-.78}}
for(let w of walls){let nx=clamp(ball.x,w.x,w.x+w.w),ny=clamp(ball.y,w.y,w.y+w.h),dx=ball.x-nx,dy=ball.y-ny,d=Math.hypot(dx,dy);if(d<ball.r){if(d===0){let sides=[{d:ball.x-w.x,nx:-1,ny:0},{d:w.x+w.w-ball.x,nx:1,ny:0},{d:ball.y-w.y,nx:0,ny:-1},{d:w.y+w.h-ball.y,nx:0,ny:1}].sort((a,b)=>a.d-b.d),n=sides[0];ball.x+=n.nx*(n.d+ball.r);ball.y+=n.ny*(n.d+ball.r);dx=n.nx;dy=n.ny;d=1}else{dx/=d;dy/=d;ball.x+=dx*(ball.r-d);ball.y+=dy*(ball.r-d)}let dot=ball.vx*dx+ball.vy*dy;if(dot<0){ball.vx-=1.78*dot*dx;ball.vy-=1.78*dot*dy}}}
for(let co of coins)if(!co.taken&&dist(ball,co)<18){co.taken=true;score+=25;say('Moneta! +25 pkt')}
if(traps.some(t=>dist(ball,t)<t.r-2)){say('Pułapka! Kulka wraca na start.');resetBall();return}if(dist(ball,hole)<hole.r-5&&Math.hypot(ball.vx,ball.vy)<240){levelWin();return}if(Math.hypot(ball.vx,ball.vy)<5||shotAge>12){ball.vx=ball.vy=0;moving=false;if(shots<=0){state='lost';record()}sync()}}
function update(dt){if(state!=='playing'||paused)return;age+=dt;toastTime=Math.max(0,toastTime-dt);hintTime=Math.max(0,hintTime-dt);pulse=Math.max(0,pulse-dt);if(MODE===0){clock=Math.max(0,clock-dt);inv=Math.max(0,inv-dt);let dx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),dy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);if(pointer){dx=pointer.x-player.x;dy=pointer.y-player.y}let length=Math.hypot(dx,dy);if(length){let step=Math.min(pointer?length:999,240*dt);player.x+=dx/length*step;player.y+=dy/length*step}player.x=clamp(player.x,A.x+13,A.x+A.w-13);player.y=clamp(player.y,A.y+13,A.y+A.h-13);for(let i=stars.length-1;i>=0;i--)if(dist(player,stars[i])<24){stars.splice(i,1);score++;spawnStar();say('Gwiazda! '+score+'/25')}

function syncHUD(){$('score').textContent=MODE===0?'GWIAZDY '+score+'/25':'PUNKTY '+score;$('meter').textContent=MODE===0?'♥ '.repeat(Math.max(0,hp))+' • '+Math.ceil(clock)+' s':MODE===1?'RUCHY '+moves:'TRASA '+level+'/10 • RZUTY '+shots;$('best').textContent='REKORD '+best;$('notice').textContent=toastTime>0?toast:MODE===0?'Zbierz 25 gwiazd w 60 sekund. Omijaj komety.':MODE===1?'Zamień sąsiadów. Łącz minimum 3. Cel: 750 punktów.':moving?'Poczekaj, aż kulka zwolni.':'Przeciągnij od kulki w tył i puść. Traf do zielonego celu.'}
function sync(){syncHUD();$('pause').textContent=paused?'Wznów':'Pauza';$('pause').disabled=state!=='playing';$('panel').style.display=['menu','won','lost','level'].includes(state)?'flex':'none';$('panelTitle').textContent=state==='menu'?TITLE:state==='won'?'Świetna robota!':state==='level'?'Cel trafiony!':'Spróbuj ponownie';$('panelText').textContent=state==='menu'?"Zamieniaj dwa s\u0105siednie owoce, aby tworzy\u0107 linie przynajmniej trzech. Zdob\u0105d\u017a 750 punkt\u00f3w w 20 ruchach. Kaskady mno\u017c\u0105 punkty!":state==='level'?`Trasa ${level} ukończona. Wynik: ${score} pkt. Czeka kolejna plansza.`:state==='won'?`Wygrywasz! Twój wynik: ${score}. Rekord: ${best}.`:`Wynik: ${score}. ${MODE===0?'Łap gwiazdy i unikaj czerwonych komet.':MODE===1?'Szukaj dłuższych połączeń oraz kaskad.':'Masz 8 rzutów na trasę. Wykorzystaj odbicia.'}`;$('start').textContent=state==='level'?'Następna trasa':state==='lost'&&MODE===2?'Powtórz trasę':'Rozpocznij';if(MODE===2){$('route').innerHTML=Array.from({length:unlocked},(_,i)=>`<option value="${i+1}" ${i+1===level?'selected':''}>Trasa ${i+1}</option>`).join('')}$('extra').textContent=MODE===0?'Magnes ('+magnet+')':MODE===1?'Podpowiedź':'Zatrzymaj kulkę';$('extra').disabled=state!=='playing'||paused||(MODE===2&&!moving)||(MODE===0&&magnet<=0)}
function circle(x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill()}
function rounded(x,y,w,h,r,col,stroke){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=col;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=2;c.stroke()}}
function star(x,y,r,col){c.beginPath();for(let i=0;i<10;i++){let a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.46:r;i?c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):c.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath();c.fillStyle=col;c.fill()}
function fruit(x,y,v,r){circle(x,y+3,r,'#0003');if(v===0){circle(x-5,y,r*.75,palette[v]);circle(x+5,y,r*.75,palette[v]);c.fillStyle='#3a8059';c.beginPath();c.ellipse(x+6,y-r,8,4,-.5,0,7);c.fill()}if(v===1){c.fillStyle=palette[v];c.beginPath();c.ellipse(x,y,r,r*.73,-.35,0,7);c.fill();c.strokeStyle='#e5a951';c.beginPath();c.ellipse(x,y,r*.65,r*.48,-.35,0,7);c.stroke()}if(v===2){circle(x,y,r,palette[v]);c.strokeStyle='#477a48';c.lineWidth=2;c.beginPath();c.moveTo(x,y-r);c.lineTo(x,y+r);c.stroke()}if(v===3){for(let [dx,dy] of [[-7,-6],[7,-6],[0,5]])circle(x+dx,y+dy,r*.58,palette[v]);c.fillStyle='#7aac70';c.fillRect(x-2,y-r-5,4,8)}if(v===4){circle(x,y,r,palette[v]);star(x,y-r*.5,5,'#285d83')}circle(x-r*.3,y-r*.3,3,'#fff8')}
function render(){let bg=c.createLinearGradient(0,0,543,543);bg.addColorStop(0,MODE===0?'#172642':MODE===1?'#2a2538':'#173a3d');bg.addColorStop(1,'#0a1423');c.fillStyle=bg;c.fillRect(0,0,543,543);rounded(A.x-3,A.y-3,A.w+6,A.h+6,16,'#060f1c','#719bac44');c.save();c.beginPath();c.rect(A.x,A.y,A.w,A.h);c.clip();if(MODE===0){for(let i=0;i<70;i++){let x=A.x+(i*71)%A.w,y=A.y+(i*47)%A.h;circle(x,y,i%3===0?1.4:.7,'#b5d5f555')}for(let s of stars){circle(s.x,s.y,16,'#ffd56d18');star(s.x,s.y,10,'#ffe19b')}if(pulse>0&&player.r){c.strokeStyle='#9eeefa88';c.lineWidth=2;c.beginPath();c.arc(player.x,player.y,(.5-pulse)*180+10,0,7);c.stroke()}for(let e of comets){circle(e.x-6,e.y+5,14,'#d7626922');circle(e.x,e.y,11,'#f87e85');circle(e.x-3,e.y-3,4,'#ffc3b5')}if(state!=='menu'&&(inv===0||Math.floor(age*12)%2===0)){circle(player.x,player.y,21,'#7ad8e71a');circle(player.x,player.y,12,'#8fdfef');circle(player.x-3,player.y-3,5,'#e1ffff');star(player.x,player.y,7,'#3c8baf')}}
if(MODE===1){let sz=55.5,bx=105,by=124;for(let i=0;i<36;i++){let x=bx+i%6*sz,y=by+(i/6|0)*sz;rounded(x+2,y+2,sz-4,sz-4,10,selected===i?'#526477':'#192d41',hintTime>0&&hintCells.includes(i)?'#ffe3a1':selected===i?'#c5eee9':null);if(grid.length)fruit(x+sz/2,y+sz/2,grid[i],16)}}
if(MODE===2&&ball.r){for(let y=A.y+10;y<A.y+A.h;y+=22)for(let x=A.x+10;x<A.x+A.w;x+=22)circle(x,y,1,'#7fc1b21a');for(let w of walls){rounded(w.x+2,w.y+4,w.w,w.h,7,'#0005');rounded(w.x,w.y,w.w,w.h,7,'#7a9f9a','#bad2bd66')}for(let t of traps){circle(t.x,t.y,t.r+3,'#ef8b8b22');circle(t.x,t.y,t.r,'#101222');c.strokeStyle='#e4979e';c.lineWidth=2;c.beginPath();c.arc(t.x,t.y,t.r-3,0,7);c.stroke()}circle(hole.x,hole.y,hole.r+7,'#8ff3b333');circle(hole.x,hole.y,hole.r,'#8ce8b4');circle(hole.x,hole.y,hole.r-5,'#174f4c');for(let co of coins)if(!co.taken){circle(co.x,co.y,9,'#edca75');circle(co.x,co.y,5,'#ffe7a6')}if(drag&&!moving){let dx=drag.x-drag.nowX,dy=drag.y-drag.nowY,d=Math.hypot(dx,dy),power=Math.min(150,d),f=power/(d||1);c.strokeStyle='#d3fff4';c.lineWidth=2;c.setLineDash([5,6]);c.beginPath();c.moveTo(ball.x,ball.y);c.lineTo(ball.x+dx*f,ball.y+dy*f);c.stroke();c.setLineDash([])}circle(ball.x+2,ball.y+4,ball.r,'#0004');let g=c.createRadialGradient(ball.x-4,ball.y-4,1,ball.x,ball.y,11);g.addColorStop(0,'#fff');g.addColorStop(1,'#67cfc7');circle(ball.x,ball.y,ball.r,g)}c.restore();if(paused){rounded(A.x,A.y,A.w,A.h,10,'#081827ef');c.fillStyle='#fff';c.font='bold 28px system-ui';c.textAlign='center';c.fillText('PAUZA',271,295)}}
function point(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*543/r.width,y:(e.clientY-r.top)*543/r.height}}function inArena(q){return q.x>=A.x&&q.x<=A.x+A.w&&q.y>=A.y&&q.y<=A.y+A.h}cv.onpointerdown=e=>{if(state!=='playing'||paused)return;let q=point(e);if(!inArena(q))return;cv.setPointerCapture(e.pointerId);if(MODE===0)pointer=q;if(MODE===1){let col=Math.floor((q.x-105)/55.5),r=Math.floor((q.y-124)/55.5);if(col>=0&&col<6&&r>=0&&r<6)fruitClick(r*6+col);sync();render()}if(MODE===2&&!moving&&dist(q,ball)<35)drag={x:q.x,y:q.y,nowX:q.x,nowY:q.y}};cv.onpointermove=e=>{let q=point(e);if(MODE===0&&pointer)pointer=q;if(drag){drag.nowX=q.x;drag.nowY=q.y}};cv.onpointerup=e=>{pointer=null;if(drag){let q=point(e),dx=drag.x-q.x,dy=drag.y-q.y;drag=null;launch(dx,dy)}};cv.onpointercancel=()=>{pointer=null;drag=null};
$('start').onclick=()=>{if(state==='level'){level++;levelBaseScore=score;setupLevel();state='playing';sync()}else if(state==='lost'&&MODE===2){score=levelBaseScore;setupLevel();state='playing';sync()}else start(1)};$('route').onchange=e=>start(+e.target.value);$('restart').onclick=()=>start(1);$('pause').onclick=()=>{if(state==='playing'){paused=!paused;keys={};pointer=null;drag=null;sync()}};$('reset').onclick=()=>{best=0;unlocked=1;save();start(1)};$('extra').onclick=()=>{if(state!=='playing'||paused)return;if(MODE===0&&magnet>0){magnet--;pulse=.5;let caught=0;for(let i=stars.length-1;i>=0;i--)if(dist(player,stars[i])<95){stars.splice(i,1);score++;caught++;spawnStar()}say('Magnes: +'+caught+' gwiazd');sync()}if(MODE===1){hintCells=possible();hintTime=3;say('Zamień dwa podświetlone owoce.')}if(MODE===2&&moving){ball.vx=ball.vy=0;moving=false;if(shots<=0){state='lost';record()}sync()}};
window.addEventListener('keydown',e=>{if(['BUTTON','SELECT'].includes(e.target.tagName)&&['Enter','Space'].includes(e.code))return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(!e.repeat&&e.code==='KeyP')$('pause').click();if(!e.repeat&&e.code==='KeyH'&&MODE===1)$('extra').click()});window.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('blur',()=>{keys={};pointer=null;drag=null;if(state==='playing'&&!paused)$('pause').click()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing'&&!paused)$('pause').click()});let last=performance.now(),acc=0;function frame(){let now=performance.now();acc+=Math.min((now-last)/1000,.25);last=now;while(acc>=1/120){update(1/120);acc-=1/120}render();if(MODE===2)$('extra').disabled=state!=='playing'||paused||!moving}sync();render();setInterval(frame,1000/60);
